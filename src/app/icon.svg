<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="10" fill="#141414"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="9.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- textLength pins the glyph run to 46px inside the 64px tile, so "145" always
       fits with even padding no matter which system font renders the SVG. -->
  <text
    x="32"
    y="43"
    text-anchor="middle"
    textLength="46"
    lengthAdjust="spacingAndGlyphs"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    fill="#e8ecf2"
  >1<tspan fill="#7fa9ff">4</tspan>5</text>
</svg>
